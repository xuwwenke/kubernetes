apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow
        image: docker-registry:81/harbor-mlflow/mlflow:arm64
        args:
        - "server"
        - "--host"
        - "$(MLFLOW_HOST)"
        - "--port"
        - "$(MLFLOW_PORT)"
        - "--backend-store-uri"
        - "postgresql://$(MLFLOW_DB_USER):$(MLFLOW_DB_PASSWORD)@$(MLFLOW_DB_HOST):$(MLFLOW_DB_PORT)/$(MLFLOW_DB_NAME)"
        - "--default-artifact-root"
        - "s3://$(MLFLOW_BUCKET)/"
        - "--serve-artifacts"
        ports:
        - containerPort: 5000
        env:
        # 数据库连接配置（与之前相同）
        - name: MLFLOW_HOST
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_HOST
        - name: MLFLOW_PORT
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_PORT
        - name: MLFLOW_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_DB_HOST
        - name: MLFLOW_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_DB_PORT
        - name: MLFLOW_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_DB_NAME
        - name: MLFLOW_DB_USER
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_DB_USER
        - name: MLFLOW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: MLFLOW_DB_PASSWORD
        # MinIO 配置
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://minio:9000"        # MinIO 服务地址
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: minio-secret            # 使用 MinIO 的 secret
              key: MINIO_ROOT_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
        - name: MLFLOW_BUCKET
          value: "mlflow"                    # bucket 名称
        # 可选：如果 MinIO 使用虚拟主机风格或需要其他设置
        # - name: AWS_DEFAULT_REGION
        #   value: "us-east-1"
